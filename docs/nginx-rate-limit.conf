# nginx rate-limit + cache config for the UHRI API VM
# -----------------------------------------------------
# This file is a RECIPE, not in-use production config.  Apply on the
# university-hosted VM (150.254.115.204) that serves /api/data/*.
#
# What it does:
#   1. Per-IP rate limits — two zones: general (20 r/s burst 60) and
#      heavy (0.5 r/s burst 3 for /api/data/full and /export).
#   2. Shared-content caching — common queries (no query params OR
#      top 50 most-visited permutations) served from nginx memory for
#      30–60s, avoiding the Python+SQLite round-trip for repeated hits.
#   3. User-agent restriction for abusive scrapers (403 with JSON hint).
#
# None of this requires touching the Python app; it's pure nginx
# upstream.  Enable with `nginx -t && systemctl reload nginx`.
#
# Estimated capacity lift: 20-50× on repeat-query bursts (CDN-like),
# 3-5× on rate-limit mitigated abuse, zero impact on legitimate
# distinct users (1 user can still send 20 requests/second).

# ---------- 1. Rate-limit zones (place in nginx.conf http { }) ----------

# General API throughput — 20 req/sec sustained per IP, burst to 60
# without rejecting, excess 429s.  Covers the typical SPA behaviour
# (4 parallel fetches on boot + periodic facets refresh).
limit_req_zone $binary_remote_addr zone=uhri_api:10m rate=20r/s;

# Heavy bulk endpoints — 0.5 req/sec per IP, burst 3.  An honest
# researcher typically hits /api/data/full or /export once or twice
# per session; a crawler hammering would be throttled hard.
limit_req_zone $binary_remote_addr zone=uhri_api_heavy:10m rate=30r/m;

# Connection cap — max 10 concurrent connections per IP across ALL
# endpoints.  Stops slow-loris patterns where an attacker opens 200
# connections and dribbles the body byte-by-byte.
limit_conn_zone $binary_remote_addr zone=uhri_conn:10m;

# ---------- 2. Proxy cache zones ----------

# Cache location — adjust path to whatever disk / tmpfs you prefer.
# tmpfs is ideal (RAM-speed) if you have the RAM.
proxy_cache_path /var/cache/nginx/uhri levels=1:2 keys_zone=uhri_cache:20m
                 max_size=500m inactive=1h use_temp_path=off;

# ---------- 3. Known bad UA block (optional, place early) ----------

# Drop requests from UAs that have historically abused the API.  List
# is small and specific — adding well-known AI agent UAs (GPTBot,
# ClaudeBot, etc.) would be wrong; those respect Crawl-delay in our
# robots.txt and are welcome.
map $http_user_agent $uhri_ua_block {
    default 0;
    "~*(spiderfoot|nuclei|nikto|sqlmap|masscan|zgrab)" 1;
    "~*^-?$"  1;    # completely empty UA — only script-kiddies do that
}

# ---------- 4. Server-block snippet (drop into your server { }) ----------

# server {
#     listen 443 ssl http2;
#     server_name 150.254.115.204;  # or your domain
#     ...

    # Reject known-abusive UAs up front.  Honest mistakes (misconfigured
    # crawlers) get a hint in the response body.
    if ($uhri_ua_block) {
        return 403 '{"error":"Scanner UAs are blocked. See /robots.txt for access policy."}';
    }

    # Per-IP connection cap applies to everything.
    limit_conn uhri_conn 10;

    # Universal baseline rate limit — 20 r/s, burst 60.
    limit_req  zone=uhri_api burst=60 nodelay;

    # Tighter limit just for bulk endpoints (stacks on top of baseline).
    location ~ ^/uhri-api/api/data/(full|export)(/|$) {
        limit_req  zone=uhri_api_heavy burst=3 nodelay;
        # Rejected requests return 429 by default — we add a clearer body.
        error_page 429 = @rate_limited_heavy;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
    }

    # Cache the frequently-hit lightweight GET endpoints for 60s.  Paired
    # with stale-while-revalidate so users never wait on re-fetch.
    location ~ ^/uhri-api/api/data/(facets|map|analytics|health)$ {
        proxy_cache         uhri_cache;
        proxy_cache_valid   200  60s;
        proxy_cache_valid   404  10s;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock    on;          # coalesce concurrent misses
        proxy_cache_key     "$scheme$request_method$host$request_uri";
        add_header          X-Cache-Status $upstream_cache_status;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Search / records endpoint — also cacheable but per-query.  Keep
    # the cache short (30s) because this is the hottest endpoint.
    location ~ ^/uhri-api/api/data/records(/|$) {
        proxy_cache         uhri_cache;
        proxy_cache_valid   200  30s;
        proxy_cache_lock    on;
        proxy_cache_key     "$scheme$request_method$host$request_uri";
        add_header          X-Cache-Status $upstream_cache_status;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Friendly error responses.
    location @rate_limited_heavy {
        add_header Content-Type application/json always;
        return 429 '{"error":"rate_limited","hint":"Bulk endpoints allow 30 req/min/IP. Use OHCHR UHRI direct download for full-corpus needs: https://uhri.ohchr.org"}';
    }
# }

# ---------- 5. Apply ----------
#
#   sudo cp nginx-rate-limit.conf /etc/nginx/conf.d/uhri-rate-limit.conf
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Monitor with:
#   tail -f /var/log/nginx/access.log | grep -v " 200 "     # non-2xx
#   nginx-cache-hit-ratio script from proxy_cache_path metrics
