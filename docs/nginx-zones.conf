# UHRI API rate-limit + scanner-UA zones
# --------------------------------------
# Drop-in file: copy verbatim to /etc/nginx/conf.d/uhri-zones.conf
# on the API VM (150.254.115.204).  Zones are defined at the http
# scope; the sites-enabled/default server block references them via
# `limit_req`, `limit_conn`, and `$uhri_ua_block`.  See
# docs/nginx-server-snippet.md for the server-block edits.
#
# Deployed live on 2026-04-24.  Validated via:
#   - normal GET  → 200
#   - UA=sqlmap/1 → 403 (scanner block)
#   - 100 × parallel /records → ~60 × 200 + ~40 × 429 (rate-limit fires)

# ---------- Rate-limit zones ----------

# General: 20 req/sec sustained per IP, burst to 60 without rejecting.
# Covers the typical SPA boot (4 parallel fetches) + interactive use.
limit_req_zone  $binary_remote_addr zone=uhri_api:10m       rate=20r/s;

# Heavy bulk endpoints — 30 req/min per IP.  Covers /api/data/full,
# /api/data/export, /api/feedback.  Honest researchers rarely hit
# these more than a few times per session; crawlers get throttled.
limit_req_zone  $binary_remote_addr zone=uhri_api_heavy:10m rate=30r/m;

# Max 10 concurrent connections per IP across all server endpoints.
# Slow-loris defence — stops an attacker holding 200 half-open TCP
# sockets and dribbling bytes.
limit_conn_zone $binary_remote_addr zone=uhri_conn:10m;

# ---------- Response-code overrides ----------
# Default nginx rate-limit status is 503 (Service Unavailable).  We
# override to 429 (Too Many Requests) because:
#   1. Semantically correct — 503 implies upstream outage; 429 means
#      "you're hitting us too hard, back off".
#   2. Client behaviour — most HTTP clients auto-retry 503 aggressively
#      and back off on 429.  Aggressive retries after 503 DO amplify
#      the load you're trying to shed.
#   3. CDN behaviour — CDNs (Cloudflare, etc.) cache 503 responses
#      briefly as "origin down".  429 is treated as a rate-limit
#      signal and passed through correctly.
limit_req_status  429;
limit_conn_status 429;

# ---------- Scanner UA rejection map ----------
# Bind $uhri_ua_block to 1 for well-known vulnerability scanners and
# empty User-Agent strings.  The server block invokes it via a single
# `if ($uhri_ua_block = 1) { return 403; }` at the top of port 443.
#
# Note: known-good AI agent UAs (GPTBot, ClaudeBot, PerplexityBot,
# Google-Extended, CCBot) are deliberately NOT on this list — they
# respect our robots.txt Crawl-delay and are welcome.
map $http_user_agent $uhri_ua_block {
    default 0;
    "~*(nuclei|nikto|sqlmap|masscan|zgrab|spiderfoot)" 1;
    "~*^-?$" 1;
}
