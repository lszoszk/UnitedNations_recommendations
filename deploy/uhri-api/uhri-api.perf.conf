# UHRI Dataset API — nginx performance overlay
# ---------------------------------------------------------------------------
# Drop-in snippet that layers gzip + Cache-Control on top of the existing
# location /uhri-api/ block in /etc/nginx/sites-available/default.
#
# Goals:
#   1. Compress JSON responses (we measured: identity size == gzip size
#      today, because the default nginx gzip_types only covers text/html).
#   2. Let browsers + our Service Worker cache facets/map/analytics/summary
#      for 15 min with stale-while-revalidate, and individual /record/{id}
#      for 24 h (they're immutable by AnnotationId).
#
# Install path:  /etc/nginx/conf.d/uhri-api-perf.conf
# Apply:         sudo nginx -t && sudo systemctl reload nginx
# Verify:        curl -sk -H 'Accept-Encoding: gzip' -D - -o /dev/null \
#                  https://150.254.115.204/uhri-api/api/data/analytics?dataset=cleaned \
#                  | grep -iE 'content-encoding|cache-control|content-length'
#                  → should now show `content-encoding: gzip` and a
#                    cache-control header.
# ---------------------------------------------------------------------------

# ---- 1. Compress JSON (and the usual text types) ---------------------------
# The main nginx.conf already has `gzip on;` but no `gzip_types`, so by
# default only text/html is compressed. Extend coverage:
gzip_types
    application/json
    application/javascript
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;
gzip_comp_level 6;          # balance CPU vs. ratio — 6 is nginx default sweet-spot
gzip_min_length 256;        # don't waste CPU on tiny 30-byte pings
gzip_vary on;               # emit "Vary: Accept-Encoding" so caches do the right thing
gzip_proxied any;           # compress even when responses are proxied from FastAPI


# ---- 2. Cache-Control on data endpoints ------------------------------------
# These headers are added *on top of* whatever FastAPI emits. If FastAPI also
# sets Cache-Control we'll have two headers; pick one side (prefer nginx here
# since we don't want to redeploy the API for a cache-policy tweak).
#
# Serve the location blocks INSIDE the existing `server { listen 443 ssl http2;
# ... }` block in /etc/nginx/sites-available/default, directly above the
# generic `location /uhri-api/ { ... }` block.

# Heavy static-ish JSON: facets, map, analytics, summary
# Changes roughly monthly (UHRI refresh), so a 15-min browser cache +
# 24-hour stale-while-revalidate is a good default.
location ~ ^/uhri-api/api/data/(facets|map|analytics|summary)$ {
    add_header Cache-Control "public, max-age=900, stale-while-revalidate=86400" always;
    add_header X-Cache-Policy "swr-15m"                                          always;
    rewrite ^/uhri-api/(.*)$ /$1 break;
    proxy_pass http://uhri_api;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
}

# Individual records: immutable per AnnotationId (UUID).
# Cache hard for 24 h; SW picks them up from Cache API on return visits.
location ~ ^/uhri-api/api/data/record/[0-9a-f-]+$ {
    add_header Cache-Control "public, max-age=86400, immutable"                  always;
    add_header X-Cache-Policy "immutable-24h"                                    always;
    rewrite ^/uhri-api/(.*)$ /$1 break;
    proxy_pass http://uhri_api;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
}

# Records search / pagination: user-specific filter combos.
# Short browser cache so F5 reloads stay snappy, no shared cache.
location ~ ^/uhri-api/api/data/records$ {
    add_header Cache-Control "private, max-age=60"                               always;
    add_header X-Cache-Policy "private-60s"                                      always;
    rewrite ^/uhri-api/(.*)$ /$1 break;
    proxy_pass http://uhri_api;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
}

# Never cache: feedback POST, full dump, export
# (these are already in the frontend's NETWORK_ONLY list; make server-side explicit)
location ~ ^/uhri-api/api/(feedback|data/(full|export|refresh_status))$ {
    add_header Cache-Control "no-store"                                          always;
    rewrite ^/uhri-api/(.*)$ /$1 break;
    proxy_pass http://uhri_api;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
}

# Note: the generic `location /uhri-api/ { ... }` block in
# sites-available/default still matches everything else (/api/data/health,
# /api/data/cache_status, /api/feedback/stats, etc.) — leave it unchanged.
