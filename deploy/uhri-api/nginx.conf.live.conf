# Snapshot of /etc/nginx/nginx.conf on amuvm as of 2026-04-19.
# Additions vs Ubuntu default:
#   - gzip_types expanded to cover application/json, SVG, etc.
#   - map $args $uhri_precompute_ds  (Tier 2 precompute routing)

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_buffers 16 8k;
	gzip_http_version 1.1;
	gzip_types text/plain text/css application/json application/javascript application/manifest+json application/xml text/xml application/xml+rss image/svg+xml text/javascript;

	# Precompute: decide which precomputed-cache directory to serve.
	# For filtered queries, $uhri_precompute_ds is empty → try_files falls through.
	map $args $uhri_precompute_ds {
		default "";
		""                "cleaned";
		"dataset=cleaned" "cleaned";
		"dataset=raw"     "raw";
	}

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


