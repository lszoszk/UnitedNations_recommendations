# Snapshot of /etc/nginx/sites-enabled/default on amuvm (post Monthly Refresh).
# NOTE: regular file, NOT a symlink to sites-available/default.
#
# Hot-fix trail 2026-04-19:
#   1. Tier 2 precompute with gzip off + single Content-Type
#   2. OPTIONS preflight via error_page 418 → @uhri_upstream
#   3. Access-Control-Allow-Origin on precompute location (Safari "Load failed" fix)
#   4. Added /uhri-api/refresh_status.json static location (Monthly Refresh dashboard hook)

upstream mattermost {
  server 127.0.0.1:8065;
}

upstream echr_api {
  server 127.0.0.1:8001;
}

upstream uhri_api {
  server 127.0.0.1:8000;
}

server {
  listen 80;
  server_name 150.254.115.204;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name 150.254.115.204;

  ssl_certificate /etc/letsencrypt/live/150.254.115.204/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/150.254.115.204/privkey.pem;

  # ---- ECHR Search API (CORS handled by FastAPI) ----
  # ---- ECHR Frontend (static HTML) ----
  location /echr/ {
    alias /home/amuvmuser/echr_rag/;
    try_files $uri =404;
  }
  # Temporary compatibility shim so the current dashboard keeps working
  # until the GitHub Pages build switches to /uhri-api/.
  # UHRI cleanup feedback inbox — same backend as /api/data/.
  location ^~ /echr-api/api/feedback/ {
    rewrite ^/echr-api/(.*)$ /$1 break;
    proxy_pass http://uhri_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  location ^~ /echr-api/api/data/ {
    rewrite ^/echr-api/(.*)$ /$1 break;
    proxy_pass http://uhri_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
  location /echr-api/ {
    rewrite ^/echr-api/(.*)$ /$1 break;
    proxy_pass http://echr_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }



  # Fallback: proxy to FastAPI upstream (for filtered queries or missing precompute)
  location @uhri_upstream {
    rewrite ^/uhri-api/(.*)$ /$1 break;
    proxy_pass http://uhri_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- PERF+PRECOMPUTE: static-ish endpoints (swr 15 min) ----
  # Serves pre-gzipped .json.gz files from disk. gzip off; here to prevent
  # nginx's on-the-fly gzip filter from double-compressing the already-gz body.
  # Non-GET methods fall through to FastAPI for CORS/etc handling.
  # CORS: FastAPI emits Access-Control-Allow-Origin normally; when we bypass
  # FastAPI by serving static files, we must emit it here too or cross-origin
  # fetches from the dashboard fail with "Load failed" (Safari) / CORS error.
  location ~ ^/uhri-api/api/data/(?<ep>facets|map|analytics|summary)$ {
    error_page 418 = @uhri_upstream;
    if ($request_method != GET) { return 418; }

    gzip off;
    types { } default_type application/json;
    charset utf-8;

    add_header Cache-Control "public, max-age=900, stale-while-revalidate=86400" always;
    add_header X-Cache-Policy "swr-15m" always;
    add_header X-Cache-Status "precompute-hit" always;
    add_header Content-Encoding "gzip" always;
    add_header Vary "Origin, Accept-Encoding" always;

    # CORS — mirrors what FastAPI emits for this origin.
    add_header Access-Control-Allow-Origin  "https://lszoszk.github.io" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    root /;
    try_files /opt/uhri/precomputed/$uhri_precompute_ds/$ep.json.gz @uhri_upstream;
  }

  # ---- PERF: immutable records by UUID (cache 24 h) ----
  location ~ ^/uhri-api/api/data/record/[0-9a-f-]+$ {
    add_header Cache-Control "public, max-age=86400, immutable" always;
    add_header X-Cache-Policy "immutable-24h" always;
    rewrite ^/uhri-api/(.*)$ /$1 break;
    proxy_pass http://uhri_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- PERF: user-specific records query (60-s private cache) ----
  location ~ ^/uhri-api/api/data/records$ {
    add_header Cache-Control "private, max-age=60" always;
    add_header X-Cache-Policy "private-60s" always;
    rewrite ^/uhri-api/(.*)$ /$1 break;
    proxy_pass http://uhri_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- PERF: never cache POSTs, full dumps, refresh status ----
  location ~ ^/uhri-api/api/(feedback|data/(full|export|refresh_status))$ {
    add_header Cache-Control "no-store" always;
    rewrite ^/uhri-api/(.*)$ /$1 break;
    proxy_pass http://uhri_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Tier-monthly-refresh: expose the machine-readable last-run status
  location = /uhri-api/refresh_status.json {
    alias /opt/uhri/last_refresh.json;
    add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
    add_header Content-Type  "application/json; charset=utf-8" always;
    add_header Access-Control-Allow-Origin "https://lszoszk.github.io" always;
    add_header Vary "Origin" always;
  }

  # Dedicated public route for the UHRI dashboard/API.
  location /uhri-api/ {
    rewrite ^/uhri-api/(.*)$ /$1 break;
    proxy_pass http://uhri_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  # ---- Mattermost websocket ----
  location ~ /api/v[0-9]+/(users/)?websocket$ {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_pass http://mattermost;
  }

  # ---- Mattermost default ----
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_pass http://mattermost;
  }
}
