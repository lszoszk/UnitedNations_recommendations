# UHRI Dataset API — nginx location snippet
# ---------------------------------------------------------------------------
# Option 1: drop as /etc/nginx/conf.d/uhri-api.conf  (wrap the location in
#           the existing server{} block that terminates TLS for the host).
# Option 2: paste the location{} block inside the existing server{} that
#           already serves /echr-api/ on https://150.254.115.204.
#
# Apply:    sudo nginx -t && sudo systemctl reload nginx
# Verify:   curl -sk https://150.254.115.204/uhri-api/api/data/health
#           → {"dataset_ready": true, "dataset_path": "...", ...}
# ---------------------------------------------------------------------------

# Route /uhri-api/* to the uvicorn process listening on 127.0.0.1:8010.
# Trailing slash on proxy_pass is load-bearing — it strips the /uhri-api
# prefix so the backend sees the paths it declares (/api/data/...).
location /uhri-api/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;

    # Preserve original client info for logs, rate limiting, CORS origin checks.
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Prefix /uhri-api;

    # Analytics on the full 267k-row dataset can take 15–19 s (measured).
    # Frontend aborts at 30 s; upstream timeout kept above that so nginx
    # is never the one to kill a working request.
    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;
    proxy_read_timeout    120s;

    # Stream large JSON straight to the client instead of buffering to disk.
    proxy_buffering         off;
    proxy_request_buffering off;

    client_max_body_size 10m;

    # CORS is handled inside FastAPI via the ALLOW_ORIGINS env var in the
    # systemd unit. If you prefer nginx-side CORS, enable the lines below
    # AND remove CORSMiddleware from setfit_backend/app.py to avoid double
    # Access-Control-Allow-Origin headers.
    #
    # add_header 'Access-Control-Allow-Origin'  'https://lszoszk.github.io' always;
    # add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    # add_header 'Access-Control-Allow-Headers' 'Content-Type, Accept' always;
    # add_header 'Access-Control-Max-Age'       '600' always;
    # if ($request_method = OPTIONS) { return 204; }
}

# Optional: lightweight external health probe (for monitoring / uptime checks).
# Bypasses the /uhri-api prefix → uvicorn's /api/data/health.
# location = /uhri-api/_ping {
#     proxy_pass http://127.0.0.1:8010/api/data/health;
#     access_log off;
# }
